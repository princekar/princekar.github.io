<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Be My Valentine?</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500&display=swap');

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            touch-action: none; /* Prevents accidental scrolling on mobile */
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 20px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 85%;
            max-width: 350px;
            border: 2px solid white;
            z-index: 10;
        }

        /* Animated CSS Heart - Won't break like a GIF! */
        .heart {
            background-color: #ff4d6d;
            display: inline-block;
            height: 50px;
            margin: 0 10px;
            position: relative;
            top: 0;
            transform: rotate(-45deg);
            width: 50px;
            animation: beat .8s infinite;
            margin-bottom: 40px;
        }

        .heart:before, .heart:after {
            content: "";
            background-color: #ff4d6d;
            border-radius: 50%;
            height: 50px;
            position: absolute;
            width: 50px;
        }

        .heart:before { top: -25px; left: 0; }
        .heart:after { left: 25px; top: 0; }

        @keyframes beat {
            0% { transform: scale(1) rotate(-45deg); }
            50% { transform: scale(1.2) rotate(-45deg); }
            100% { transform: scale(1) rotate(-45deg); }
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            color: #d63384;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 60px;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            z-index: 5;
        }

        #noBtn {
            background-color: #adb5bd;
            color: white;
            position: relative; /* Starts in the flow, then becomes fixed */
            z-index: 10;
        }

        #success-msg { display: none; }
        #success-msg h1 { color: #ff1e4d; }
    </style>
</head>
<body>

    <div class="container">
        <div id="ask-section">
            <div class="heart"></div>
            <h1>Will you be my Valentine?</h1>
            <div class="btn-group">
                <button id="yesBtn" onclick="showSuccess()">Yes</button>
                <button id="noBtn" 
                        onmouseover="moveButton()" 
                        onclick="moveButton()" 
                        ontouchstart="moveButton()">No</button>
            </div>
        </div>

        <div id="success-msg">
            <div class="heart"></div>
            <h1>Yay! Happy Valentine's Day! ❤️</h1>
            <p>I knew you couldn't say no!</p>
        </div>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            
            // On first interaction, switch to fixed positioning
            noBtn.style.position = 'fixed';

            // Calculate random coordinates away from the edges
            const padding = 100;
            const x = Math.random() * (window.innerWidth - padding) + (padding / 2);
            const y = Math.random() * (window.innerHeight - padding) + (padding / 2);

            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function showSuccess() {
            document.getElementById('ask-section').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
            document.body.style.background = "#ff758c";
        }
    </script>
</body>
</html>
