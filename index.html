<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 2.5rem;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid white;
            width: 85%;
            max-width: 400px;
            z-index: 10;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: #d63384;
            margin: 15px 0;
        }

        .gif-container img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            border-radius: 15px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            min-height: 50px;
        }

        button {
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
            touch-action: none;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
        }

        #noBtn {
            background-color: #adb5bd;
            color: white;
            position: absolute; /* Allows it to jump around */
        }

        #success-msg {
            display: none;
        }

        p { color: #666; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div class="container">
        <div id="ask-section">
            <div class="gif-container">
                <img src="https://media.tenor.com/IC9_6938P9wAAAAi/peach-goma-peach-and-goma.gif" alt="Cute Cat">
            </div>
            <h1>Will you be my Valentine?</h1>
            <div class="btn-group">
                <button id="yesBtn" onclick="showSuccess()">Yes</button>
                <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()" ontouchstart="moveButton()">No</button>
            </div>
        </div>

        <div id="success-msg">
            <div class="gif-container">
                <img src="https://media.tenor.com/9v6T5y2Hq70AAAAi/mochi-mochi-peach-cat-cat.gif" alt="Happy Cat">
            </div>
            <h1>Yay! I knew it! ❤️</h1>
            <p>It's a date! See you soon!</p>
        </div>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            
            // Calculate random positions within the screen boundaries
            const padding = 50;
            const maxWidth = window.innerWidth - noBtn.offsetWidth - padding;
            const maxHeight = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxWidth));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxHeight));

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
            noBtn.style.position = 'fixed';
        }

        function showSuccess() {
            document.getElementById('ask-section').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
            document.body.style.background = "linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%)";
        }
    </script>
</body>
</html>
